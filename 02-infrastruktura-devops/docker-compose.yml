services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: stadion-mqtt-broker
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ../03-bezpieczenstwo-sec/certyfikaty:/mosquitto/certs:ro
    networks:
      - edge_net
      - dmz_net

  ntp-server:
    image: cturra/ntp:latest
    container_name: stadion-ntp
    restart: unless-stopped
    environment:
      - NTP_SERVERS=pool.ntp.org
    networks:
      - dmz_net
      - cloud_net

networks:
  edge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.20.0/24
  cloud_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
